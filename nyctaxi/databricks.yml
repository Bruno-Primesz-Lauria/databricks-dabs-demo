# This is a Databricks asset bundle definition for nyctaxi.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: nyctaxi
  uuid: ba328c00-f9f6-42fb-97aa-f93b9714c2cf

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-9b4c65cf-fd13.cloud.databricks.com
    resources:                            
      jobs:
        nyctaxi_job:
          tasks:
            - task_key: notebook_task
              notebook_task:
                base_parameters:
                  catalog: "dev"            
                  schema: "nyc_taxi_dabs"
                  table:  "nyctaxi_demo"

  prod:
    mode: production
    workspace:
      host: https://dbc-9b4c65cf-fd13.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/bruno.primesz@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/bruno.primesz@gmail.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: bruno.primesz@gmail.com
        level: CAN_MANAGE
    resources:                            
      jobs:
        nyctaxi_job:
          tasks:
            - task_key: notebook_task
              notebook_task:
                base_parameters:
                  catalog: "prd"            # override p/ PROD
                  schema: "nyc_taxi_dabs"
                  table:  "nyctaxi_demo"
