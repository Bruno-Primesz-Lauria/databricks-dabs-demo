# The main pipeline for nyctaxi
resources:
  pipelines:
    nyctaxi_pipeline:
      name: nyctaxi_pipeline
      catalog: workspace
      schema: nyctaxi_${bundle.target}
      serverless: true
      libraries:
        - notebook:
            path: ../src/pipeline.ipynb

      configuration:
        bundle.sourcePath: ${workspace.file_path}/src
